[/Script/WeatherPipeline.MyActor_weather]
; Weather and sky both come from the Ultra Dynamic Weather / Ultra Dynamic Sky actors placed in
; Ingolstadt. The pipeline no longer spawns any sky, light or fog actor of its own — the old
; bAutoSpawnDefaultSky / bAutoSpawnHeightFog settings (which caused the red/yellow and brown haze
; in this Cesium globe world) no longer exist, and bDisableConflictingSkyActors now hides any stray
; engine sky actor at BeginPlay so UDS stays the single source of lighting.
;
; Per-run overrides go here rather than in C++ when you want to change them without a rebuild:
; TimeOfDay=1400
; bAnimateTimeOfDay=False
; bUseGeoreferencedSun=True
; DLWEAreaSize=30000.0

